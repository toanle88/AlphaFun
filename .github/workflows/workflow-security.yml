name: 'Security - Workflow Pinning'

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-pins:
    name: '🔐 Verify workflow action pins'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require full commit SHA action pins
        shell: bash
        run: |
          set -euo pipefail
          invalid_refs=0
          while IFS= read -r line; do
            ref="${line##*uses: }"
            ref="${ref%%[[:space:]#]*}"
            if [[ ! "${ref}" =~ ^[^@]+@[0-9a-f]{40}$ ]]; then
              echo "Unpinned or invalid action reference: ${ref}" >&2
              invalid_refs=1
            fi
          done < <(grep -RhsE '^[[:space:]]+uses:[[:space:]]+' .github/workflows --include='*.yml' --include='*.yaml')
          exit "${invalid_refs}"
