name: '02 - App Deploy (Production)'

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Known-good commit SHA or ref to build for a controlled rollback'
        required: false
        type: string
  push:
    branches: [main]
    paths-ignore:
      - 'infra/**'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  build:
    name: '🔨 Build: Production Artifact'
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && github.event.action == 'published' && github.event.release.target_commitish == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Validate rollback source
        if: github.event_name == 'workflow_dispatch' && inputs.source_ref != ''
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_ref must be a 40-character commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0

      - name: Verify rollback commit
        if: github.event_name == 'workflow_dispatch' && inputs.source_ref != ''
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "${checked_out_sha}" != "${SOURCE_REF}" ]]; then
            echo "Checked-out commit does not match source_ref" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${SOURCE_REF}" origin/main; then
            echo "Rollback commit must be an ancestor of origin/main" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test -- --run

      - name: Production build
        run: pnpm build

      - name: Upload production artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-dist
          path: dist
          if-no-files-found: error

  deploy:
    name: '🚀 Deploy: Production'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download production artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-dist
          path: dist

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1.0.0
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true

      - name: Report production deployment
        if: always()
        env:
          DEPLOYMENT_STATUS: ${{ steps.deploy.outcome }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          DEPLOYMENT_REF: ${{ inputs.source_ref || github.sha }}
        run: |
          {
            echo "## Production deployment"
            echo "- Status: ${DEPLOYMENT_STATUS}"
            echo "- Source ref: ${DEPLOYMENT_REF}"
            if [ -n "${DEPLOYMENT_URL}" ]; then
              echo "- URL: [${DEPLOYMENT_URL}](${DEPLOYMENT_URL})"
            else
              echo "- URL: Azure did not return a deployment URL"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
